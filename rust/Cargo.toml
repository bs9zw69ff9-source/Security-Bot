[package]
name = "guardian-bot"
version = "3.0.0"
edition = "2021"
description = "Multi-server Discord security bot: anti-nuke, anti-raid, anti-spam, snapshots/rollback, per-server config, SQLite persistence."

[[bin]]
name = "guardian-bot"
path = "src/main.rs"

[dependencies]
serenity = { version = "0.12", default-features = false, features = [
    "client", "gateway", "rustls_backend", "model", "cache", "collector", "builder", "http", "utils",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "sync"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
once_cell = "1"
regex = "1"
futures = "0.3"
indexmap = { version = "2.14.0", features = ["serde"] }

[profile.release]
opt-level = 2
